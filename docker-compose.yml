services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: flask_backend
    restart: always
    ports:
      - "5000:5000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: express_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
